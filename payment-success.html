<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Received - ReviewLens</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08101e;
      --panel: rgba(255, 255, 255, .07);
      --line: rgba(255, 255, 255, .14);
      --text: #f5f7fb;
      --muted: rgba(245, 247, 251, .72);
      --green: #56e39f;
      --indigo: #7c83ff;
      --pink: #ef7bb6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font: 16px/1.7 "DM Sans", system-ui, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(86, 227, 159, .16), transparent 30%),
        linear-gradient(180deg, #060b14 0%, var(--bg) 100%);
    }
    main {
      width: min(680px, 100%);
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .28);
    }
    .eyebrow {
      color: #d8f7e7;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--green);
    }
    h1 {
      margin: 16px 0 10px;
      font: 700 clamp(42px, 7vw, 70px)/.96 "Space Grotesk", system-ui, sans-serif;
      letter-spacing: -.06em;
    }
    p { margin: 0; color: var(--muted); }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
    a {
      padding: 12px 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: inherit;
      text-decoration: none;
    }
    .primary {
      border-color: transparent;
      background: linear-gradient(135deg, var(--indigo), var(--pink));
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Payment received</div>
    <h1>Your Pro access is being activated.</h1>
    <p>
      ReviewLens is confirming the payment with the billing provider. Return to your Shopify product page,
      reopen the extension, and click Analyze Reviews again after the access status updates.
    </p>
    <div class="actions">
      <a class="primary" href="https://reviewlensvercelsitev3.vercel.app/#pricing">Back to ReviewLens</a>
      <a href="mailto:support@voicefix.org">Contact Support</a>
    </div>
  </main>
</body>
</html>

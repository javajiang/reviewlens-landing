<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Shopify authorization success page for ReviewLens." />
  <title>Shopify Connected - ReviewLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#08101e; --panel:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
      --text:#f5f7fb; --muted:rgba(245,247,251,.72); --green:#56e39f; --indigo:#7c83ff; --pink:#ef7bb6;
    }
    *{box-sizing:border-box}
    body{
      margin:0;color:var(--text);font-family:"DM Sans",system-ui,sans-serif;
      background:radial-gradient(circle at 15% 10%, rgba(86,227,159,.16), transparent 30%), linear-gradient(180deg,#060b14 0%, var(--bg) 100%);
    }
    .page{max-width:820px;margin:0 auto;padding:24px 18px 48px}
    .card{
      margin-top:48px;padding:28px;border:1px solid var(--line);border-radius:28px;background:var(--panel);
      box-shadow:0 24px 80px rgba(0,0,0,.28)
    }
    .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(86,227,159,.12);border:1px solid rgba(86,227,159,.25);color:#d8f7e7;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
    .eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--green)}
    h1{margin:16px 0 10px;font-family:"Space Grotesk",sans-serif;font-size:clamp(42px,7vw,72px);line-height:.96;letter-spacing:-.06em}
    p{margin:0;color:var(--muted);line-height:1.7;max-width:64ch}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
    a{
      color:inherit;text-decoration:none;padding:12px 18px;border-radius:999px;border:1px solid var(--line);
      background:rgba(255,255,255,.05)
    }
    .primary{background:linear-gradient(135deg,var(--indigo),var(--pink));border-color:transparent}
  </style>
</head>
<body>
  <div class="page">
    <main class="card">
      <div class="eyebrow"><i></i> shopify authorized</div>
      <h1>Thanks. Your store is connected.</h1>
      <p>This page confirms the Shopify authorization redirect. Your store is now linked to ReviewLens.</p>
      <div class="actions">
        <a class="primary" href="index.html">Back to Home</a>
        <a href="mailto:support@voicefix.org">Contact Support</a>
      </div>
    </main>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReviewLens sign-in</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #08101e; color: #f5f7fb; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
      main { max-width: 520px; }
      p { color: #aab4c5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Signing you in...</h1>
      <p id="message">Please wait while ReviewLens returns you to the extension.</p>
    </main>
    <script>
      const context = JSON.parse(localStorage.getItem("reviewlens_login_context") || "{}");
      const extensionId = context.extensionId;
      const message = document.getElementById("message");

      if (!extensionId) {
        message.textContent = "The sign-in link is valid, but no extension was specified. Return to the ReviewLens extension and start the login flow again.";
      } else if (!window.location.hash) {
        message.textContent = "No sign-in token was received. Return to the extension and try again.";
      } else {
        const target = new URL(`chrome-extension://${extensionId}/auth-callback.html`);
        for (const [key, value] of Object.entries({
          shop: context.shop,
          handle: context.handle,
        })) {
          if (value) target.searchParams.set(key, value);
        }
        localStorage.removeItem("reviewlens_login_context");
        target.hash = window.location.hash;
        window.location.replace(target.toString());
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReviewLens sign-in</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #08101e; color: #f5f7fb; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
      main { max-width: 520px; }
      p { color: #aab4c5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Signing you in...</h1>
      <p id="message">Please wait while ReviewLens finishes signing you in.</p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const context = JSON.parse(localStorage.getItem("reviewlens_login_context") || "{}");
      const message = document.getElementById("message");

      async function loadClient() {
        const response = await fetch("/api/health?config=supabase");
        const data = await response.json();
        if (!response.ok || !data.ok || !data.supabase?.url || !data.supabase?.publishableKey) {
          throw new Error("Supabase login is not configured on this deployment.");
        }
        return window.supabase.createClient(data.supabase.url, data.supabase.publishableKey, {
          auth: {
            flowType: "implicit",
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
          },
        });
      }

      async function finishLogin() {
        const client = await loadClient();
        const { data, error } = await client.auth.getSession();
        if (error) throw error;
        if (!data.session) throw new Error("No valid sign-in session was found. Please start again.");

        if (!context.extensionId) {
          localStorage.removeItem("reviewlens_login_context");
          const target = new URL("/", window.location.origin);
          window.location.replace(target.toString());
          return;
        }

        const target = new URL(`chrome-extension://${context.extensionId}/auth-callback.html`);
        for (const [key, value] of Object.entries({ shop: context.shop, handle: context.handle })) {
          if (value) target.searchParams.set(key, value);
        }
        const tokenParams = new URLSearchParams({
          access_token: data.session.access_token,
          refresh_token: data.session.refresh_token || "",
          expires_in: String(Math.max(60, Math.floor((data.session.expires_at * 1000 - Date.now()) / 1000))),
        });
        localStorage.removeItem("reviewlens_login_context");
        target.hash = tokenParams.toString();
        window.location.replace(target.toString());
      }

      finishLogin().catch((error) => {
        message.textContent = error?.message || String(error);
        message.style.color = "#ff9c91";
      });
    </script>
  </body>
</html>
